name: Python validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src tests

  package-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and packager
        run: |
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Build single-file Windows executable
        run: pyinstaller --noconfirm --clean --onefile --name sentinel-lock --collect-all pystray src/sentinel_lock/__main__.py

      - name: Smoke-test packaged executable
        run: .\dist\sentinel-lock.exe --version

      - name: Generate package checksum
        shell: pwsh
        run: Get-FileHash .\dist\sentinel-lock.exe -Algorithm SHA256 | Format-List
