name: Stdlib validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Prove no pip dependencies
        run: python tests/check_stdlib_only.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src tests run_sentinel_lock.py

      - name: Smoke-test source launcher
        run: python run_sentinel_lock.py --version

  package-stdlib:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stdlib zipapp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m zipapp src -m "sentinel_lock.cli:main" -o dist/sentinel-lock.pyz

      - name: Smoke-test zipapp
        run: python .\dist\sentinel-lock.pyz --version

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: Get-FileHash .\dist\sentinel-lock.pyz -Algorithm SHA256 | Format-List
