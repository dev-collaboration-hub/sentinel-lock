name: Release validation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install release dependencies
        run: |
          python -m pip install -e .
          python -m pip install pyinstaller
      - name: Run release tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src tests
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --name sentinel-lock --collect-all pystray src/sentinel_lock/__main__.py
      - name: Smoke-test executable
        run: .\dist\sentinel-lock.exe --version
      - name: Require production signing certificate for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_CERT_PASSWORD)) {
            throw "Tagged releases require WINDOWS_SIGNING_CERT_BASE64 and WINDOWS_SIGNING_CERT_PASSWORD."
          }
      - name: Sign Windows executable
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "sentinel-lock-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool.FullName sign /fd SHA256 /f $certPath /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 .\dist\sentinel-lock.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
      - name: Verify Windows signature
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature .\dist\sentinel-lock.exe
          $signature | Format-List *
          if ($signature.Status -ne 'Valid') { throw "Windows executable signature is not valid: $($signature.Status)" }
      - name: Generate checksum
        shell: pwsh
        run: Get-FileHash .\dist\sentinel-lock.exe -Algorithm SHA256 | Format-List | Out-File .\dist\sentinel-lock.exe.sha256.txt
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-lock-windows
          path: |
            dist/sentinel-lock.exe
            dist/sentinel-lock.exe.sha256.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-python, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
