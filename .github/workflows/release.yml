name: Stdlib release validation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONPATH: src

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove no pip dependencies
        run: python tests/check_stdlib_only.py

      - name: Run release tests
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src tests run_sentinel_lock.py

      - name: Build stdlib zipapp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m zipapp src -m "sentinel_lock.cli:main" -o dist/sentinel-lock.pyz

      - name: Smoke-test release artifact
        run: python .\dist\sentinel-lock.pyz --version

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\sentinel-lock.pyz -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  sentinel-lock.pyz" | Out-File -Encoding ascii .\dist\sentinel-lock.pyz.sha256

      - name: Upload stdlib release artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-lock-stdlib
          path: |
            dist/sentinel-lock.pyz
            dist/sentinel-lock.pyz.sha256

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
